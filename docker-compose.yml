# ===========================================
# StarPath Astrology - Production Docker Compose
# ===========================================
# Usage: docker-compose up -d
# For production deployment with PostgreSQL and Redis

version: "3.8"

services:
  # Main Application
  # ===========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: starpath-app
    restart: unless-stopped
    environment:
      # Database
      - DATABASE_URL=postgresql://starpath:${DB_PASSWORD}@postgres:5432/starpath?schema=public
      - DIRECT_URL=postgresql://starpath:${DB_PASSWORD}@postgres:5432/starpath?schema=public
      # Redis (for future caching/session storage)
      - REDIS_URL=redis://redis:6379
      # NextAuth
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      # Stripe
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_PRICE_ID_MONTHLY=${STRIPE_PRICE_ID_MONTHLY}
      - STRIPE_PRICE_ID_YEARLY=${STRIPE_PRICE_ID_YEARLY}
      # Anthropic AI
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # Google OAuth (optional)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      # Email (optional)
      - RESEND_API_KEY=${RESEND_API_KEY}
      # Cloudinary (optional)
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - starpath-network
    volumes:
      # Mount secrets for secure password access
      - ./secrets/db_password:/run/secrets/db_password:ro
    healthcheck:
      test: ["CMD", "./healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # PostgreSQL Database
  # ===========================================
  postgres:
    image: postgres:15-alpine
    container_name: starpath-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=starpath
      - POSTGRES_USER=starpath
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-postgres:/docker-entrypoint-initdb.d:ro
      - ./secrets/db_password:/run/secrets/db_password:ro
    networks:
      - starpath-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starpath -d starpath"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis Cache
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: starpath-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - starpath-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx Reverse Proxy (Optional)
  # ===========================================
  # Uncomment this section if you want Nginx as a reverse proxy
  # nginx:
  #   image: nginx:alpine
  #   container_name: starpath-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - app
  #   networks:
  #     - starpath-network

# Networks
# ===========================================
networks:
  starpath-network:
    driver: bridge

# Volumes
# ===========================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
