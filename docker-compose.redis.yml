version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: starpath-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - starpath-network

volumes:
  redis-data:
    driver: local

networks:
  starpath-network:
    driver: bridge
